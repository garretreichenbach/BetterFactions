<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:wght@400;500&display=swap">
  <style>
    body{margin:0;background:#0b0d10;}
    a{color:#72dce7;} a:hover{color:#32e9fc;}
    .win{width:960px;height:620px;box-sizing:border-box;background:#14181c;border:1px solid #4a545c;
         display:flex;flex-direction:column;color:#c9d1d7;
         font:12px/1.45 "Saira","Segoe UI",sans-serif;}
    .stamp{position:absolute;}
    .title{flex:0 0 28px;border-bottom:1px solid #4a545c;display:flex;align-items:center;
           justify-content:space-between;padding:0 10px;font-size:13px;letter-spacing:.1em;color:#7e8a93;}
    .tabs{flex:0 0 29px;display:flex;border-bottom:1px solid #4a545c;}
    .tab{display:flex;align-items:center;padding:0 24px;font-size:12px;letter-spacing:.09em;
         color:#6d7880;border-right:1px solid #4a545c;}
    .tab.on{color:#e8eef2;box-shadow:inset 0 -2px 0 #8fa3b0;}
    .body{flex:1 1 auto;display:flex;gap:10px;padding:10px;min-height:0;}
    .box{border:1px dashed #56626b;display:flex;align-items:center;justify-content:center;
         color:#6d7880;font-size:12px;letter-spacing:.06em;text-align:center;padding:8px;box-sizing:border-box;}
    .solid{border-style:solid;}
    .navitem{display:flex;align-items:center;height:32px;padding:0 12px;border:1px solid #3d474e;
             font-size:12px;color:#9aa5ad;box-sizing:border-box;}
    .navitem.on{border-color:#8fa3b0;color:#e8eef2;background:#20272d;}
    .lbl{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#6d7880;}
  </style>
</helmet>

<div class="win">
  <div class="title"><span>FACTION</span><span style="font-size:10px;letter-spacing:.16em;">WIREFRAME &mdash; DIRECTION B</span></div>
  <div class="tabs">
    <div class="tab on">MY FACTION</div>
    <div class="tab">GALAXY</div>
  </div>

  <div class="body">
    <div style="flex:0 0 190px;display:flex;flex-direction:column;gap:6px;">
      <div class="lbl" style="padding:2px 2px 4px;">Sections</div>
      <div class="navitem on">Overview</div>
      <div class="navitem">Log</div>
      <div class="navitem">Members &nbsp;<span style="color:#6d7880;">14</span></div>
      <div class="navitem">Ranks</div>
      <div class="navitem">Settings</div>
      <div style="flex:1 1 auto;"></div>
      <div class="box" style="height:64px;">Waiting on you<br>3 items</div>
    </div>

    <div style="flex:1 1 auto;display:flex;flex-direction:column;gap:8px;min-width:0;">
      <div style="display:flex;gap:8px;">
        <div class="box solid" style="flex:0 0 240px;height:120px;">Identity card<br>name, home, description</div>
        <div class="box solid" style="flex:1 1 auto;height:120px;">Power &amp; points<br>with breakdown</div>
      </div>
      <div class="box solid" style="flex:1 1 auto;min-height:0;">Event log<br>
        <span style="font-size:11px;">scope switch: our faction / galaxy</span></div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
