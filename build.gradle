plugins {
    id 'java'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

def starmadeDirectory = project.property("starmade_root")
def modName = project.property("mod_name")
group = project.property('mod_org_id')
version = project.property('mod_version')

repositories {
    mavenCentral()
}

dependencies {
    // Compile against an engine build's classes when given (-Pstarmade_classes=<engine>/build/classes/java/main),
    // otherwise against the installed game's jar.
    if (project.hasProperty("starmade_classes")) {
        compileOnly(files(project.property("starmade_classes")))
    } else {
        compileOnly(files(starmadeDirectory + "StarMade.jar"))
    }
    compileOnly(fileTree(dir: (starmadeDirectory + "lib"), include: "*.jar"))
}

compileJava {
    options.encoding = 'UTF-8'
}

tasks.register("updateVersion") {
    doLast {
        def modJson = file('src/main/resources/mod.json')
        modJson.write(modJson.getText().replaceAll(/"version":\s*".*"/, "\"version\": \"" + version + "\""))
    }
}

jar {
    dependsOn("updateVersion")
    destinationDirectory.set(file(starmadeDirectory + "mods"))
    archiveFileName = modName + 'v' + getVersion() + '.jar'
}

interface InjectedExec {
    @javax.inject.Inject
    ExecOperations getExec()
}

// Runs every *_test class's main with -ea, like the engine's apiSelfChecks.
tasks.register('selfChecks') {
    def execOps = project.objects.newInstance(InjectedExec).exec
    group = 'verification'
    dependsOn tasks.compileJava
    doLast {
        def classesDir = sourceSets.main.output.classesDirs.singleFile
        fileTree(classesDir).matching { include '**/*_test.class' }.each { f ->
            def name = classesDir.toPath().relativize(f.toPath()).toString().replace(File.separator, '.') - '.class'
            execOps.javaexec {
                classpath = sourceSets.main.output + sourceSets.main.compileClasspath
                mainClass.set(name)
                jvmArgs '-ea'
            }
        }
    }
}
